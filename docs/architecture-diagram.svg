<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1500 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d29922"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bc8cff"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f85149"/>
    </marker>
    <linearGradient id="flow1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="flow2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.03"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1500" height="920" fill="#0d1117"/>

  <!-- Title -->
  <text x="750" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#58a6ff">Mimir + AWS Intelligent Rough Cut Architecture</text>
  <text x="750" y="48" text-anchor="middle" font-size="12" fill="#8b949e">NAB Demo — Agentic Video Analysis &amp; Automated Timeline Assembly</text>

  <!-- ==================== FLOW 1: VIDEO ANALYSIS ==================== -->
  <rect x="20" y="55" width="1460" height="310" rx="12" fill="url(#flow1-grad)" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="40" y="82" font-size="15" font-weight="700" fill="#58a6ff">FLOW 1 — Video Analysis (Webhook-Triggered)</text>
  <text x="40" y="100" font-size="11" fill="#8b949e">Mimir webhook fires on new video upload → Nova multimodal analysis → embeddings stored → frontend notified</text>

  <!-- Mimir (Source) -->
  <rect x="50" y="140" width="160" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="130" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e">Mimir</text>
  <text x="130" y="188" text-anchor="middle" font-size="10" fill="#8b949e">Video uploaded</text>
  <text x="130" y="202" text-anchor="middle" font-size="10" fill="#8b949e">Webhook fires</text>

  <line x1="210" y1="185" x2="268" y2="185" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="239" y="178" text-anchor="middle" font-size="9" fill="#58a6ff">webhook</text>

  <!-- API Gateway (Webhook) -->
  <rect x="270" y="140" width="160" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="350" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff">Amazon</text>
  <text x="350" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">API Gateway</text>
  <text x="350" y="198" text-anchor="middle" font-size="10" fill="#8b949e">/webhook/item-create</text>

  <line x1="430" y1="185" x2="488" y2="185" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Lambda (Nova Analysis) -->
  <rect x="490" y="140" width="160" height="90" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="570" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922">AWS Lambda</text>
  <text x="570" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#d29922">Video Analysis</text>
  <text x="570" y="200" text-anchor="middle" font-size="10" fill="#8b949e">Nova Multimodal</text>

  <line x1="570" y1="230" x2="570" y2="278" stroke="#d29922" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="585" y="260" font-size="9" fill="#d29922">read video</text>

  <!-- S3 Media Bucket -->
  <rect x="490" y="280" width="160" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="570" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Amazon S3</text>
  <text x="570" y="322" text-anchor="middle" font-size="10" fill="#8b949e">Media Bucket</text>
  <text x="570" y="338" text-anchor="middle" font-size="9" fill="#6e7681">(source video files)</text>

  <line x1="650" y1="170" x2="708" y2="170" stroke="#d29922" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="679" y="163" text-anchor="middle" font-size="9" fill="#d29922">invoke</text>

  <!-- Amazon Bedrock / Nova -->
  <rect x="710" y="125" width="180" height="100" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
  <text x="800" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#bc8cff">Amazon Bedrock</text>
  <text x="800" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#bc8cff">Amazon Nova</text>
  <text x="800" y="195" text-anchor="middle" font-size="10" fill="#8b949e">Multimodal Video Analysis</text>
  <text x="800" y="210" text-anchor="middle" font-size="9" fill="#6e7681">scene detection, key moments</text>

  <line x1="890" y1="185" x2="948" y2="185" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="919" y="178" text-anchor="middle" font-size="9" fill="#bc8cff">embeddings</text>

  <!-- S3 Vector Bucket -->
  <rect x="950" y="140" width="180" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="1040" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Amazon S3 Vectors</text>
  <text x="1040" y="188" text-anchor="middle" font-size="10" fill="#8b949e">Vector Bucket</text>
  <text x="1040" y="205" text-anchor="middle" font-size="9" fill="#6e7681">video embeddings + metadata</text>

  <line x1="650" y1="200" x2="708" y2="280" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>

  <!-- Frontend Notification -->
  <rect x="710" y="270" width="160" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="790" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff">Mimir Frontend</text>
  <text x="790" y="312" text-anchor="middle" font-size="10" fill="#8b949e">Analysis complete ✓</text>

  <!-- Step numbers Flow 1 -->
  <circle cx="240" cy="185" r="10" fill="#58a6ff" opacity="0.9"/>
  <text x="240" y="189" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">1</text>
  <circle cx="460" cy="185" r="10" fill="#58a6ff" opacity="0.9"/>
  <text x="460" y="189" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">2</text>
  <circle cx="680" cy="170" r="10" fill="#58a6ff" opacity="0.9"/>
  <text x="680" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">3</text>
  <circle cx="920" cy="185" r="10" fill="#58a6ff" opacity="0.9"/>
  <text x="920" y="189" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">4</text>

  <!-- ==================== FLOW 2: ROUGH CUT GENERATION ==================== -->
  <rect x="20" y="400" width="1460" height="500" rx="12" fill="url(#flow2-grad)" stroke="#3fb950" stroke-width="1" stroke-opacity="0.3"/>
  <text x="40" y="427" font-size="15" font-weight="700" fill="#3fb950">FLOW 2 — Rough Cut Generation (Custom Action)</text>
  <text x="40" y="445" font-size="11" fill="#8b949e">User selects clips in Mimir → custom action → Step Functions orchestration → AgentCore agentic flow → timeline created in Mimir</text>

  <!-- Mimir (User Action) -->
  <rect x="50" y="480" width="160" height="100" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="130" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e">Mimir</text>
  <text x="130" y="528" text-anchor="middle" font-size="10" fill="#8b949e">User selects clips</text>
  <text x="130" y="543" text-anchor="middle" font-size="10" fill="#8b949e">+ script, executes</text>
  <text x="130" y="558" text-anchor="middle" font-size="10" fill="#d29922">"Generate Rough Cut"</text>

  <line x1="210" y1="530" x2="268" y2="530" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="239" y="522" text-anchor="middle" font-size="9" fill="#3fb950">custom action</text>

  <!-- API Gateway -->
  <rect x="270" y="480" width="160" height="100" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="350" y="510" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff">Amazon</text>
  <text x="350" y="527" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">API Gateway</text>
  <text x="350" y="547" text-anchor="middle" font-size="10" fill="#8b949e">/actions/rough-cut</text>
  <text x="350" y="562" text-anchor="middle" font-size="9" fill="#6e7681">clip IDs + script data</text>

  <line x1="430" y1="530" x2="488" y2="530" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step Functions -->
  <rect x="490" y="470" width="180" height="120" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="580" y="498" text-anchor="middle" font-size="11" font-weight="600" fill="#f85149">AWS Step Functions</text>
  <text x="580" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">State Machine</text>
  <text x="580" y="538" text-anchor="middle" font-size="10" fill="#8b949e">Orchestrates the</text>
  <text x="580" y="553" text-anchor="middle" font-size="10" fill="#8b949e">rough cut workflow</text>
  <text x="580" y="575" text-anchor="middle" font-size="9" fill="#6e7681">RoughCutGenerator</text>

  <line x1="580" y1="590" x2="580" y2="638" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="595" y="620" font-size="9" fill="#3fb950">step 1</text>

  <!-- Lambda: Get Clip Details -->
  <rect x="490" y="640" width="180" height="80" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="580" y="665" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922">AWS Lambda</text>
  <text x="580" y="683" text-anchor="middle" font-size="12" font-weight="600" fill="#d29922">Get Clip Details</text>
  <text x="580" y="700" text-anchor="middle" font-size="10" fill="#8b949e">Mimir API → clip metadata</text>

  <line x1="490" y1="680" x2="210" y2="580" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
  <text x="330" y="618" font-size="9" fill="#f0883e">Mimir API</text>
  <text x="330" y="630" font-size="9" fill="#f0883e">get clip details</text>

  <line x1="670" y1="680" x2="748" y2="680" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="709" y="672" text-anchor="middle" font-size="9" fill="#3fb950">step 2</text>

  <!-- AgentCore -->
  <rect x="750" y="620" width="220" height="140" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2.5"/>
  <text x="860" y="648" text-anchor="middle" font-size="11" font-weight="600" fill="#bc8cff">Amazon Bedrock</text>
  <text x="860" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#bc8cff">AgentCore</text>
  <text x="860" y="690" text-anchor="middle" font-size="10" fill="#8b949e">Agentic Workflow:</text>
  <text x="860" y="706" text-anchor="middle" font-size="10" fill="#e6edf3">① Identify key moments</text>
  <text x="860" y="720" text-anchor="middle" font-size="10" fill="#e6edf3">② Match to script</text>
  <text x="860" y="734" text-anchor="middle" font-size="10" fill="#e6edf3">③ Generate timeline</text>
  <text x="860" y="748" text-anchor="middle" font-size="9" fill="#6e7681">w/ source IN/OUT points</text>

  <!-- AgentCore reads from S3 Vectors -->
  <line x1="860" y1="620" x2="860" y2="400" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="860" y1="400" x2="1040" y2="400" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="1040" y1="400" x2="1040" y2="235" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-purple)"/>
  <text x="960" y="393" font-size="9" fill="#bc8cff">query embeddings</text>

  <line x1="970" y1="700" x2="1048" y2="700" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1009" y="692" text-anchor="middle" font-size="9" fill="#3fb950">step 3</text>

  <!-- Lambda: Create Timeline -->
  <rect x="1050" y="650" width="180" height="100" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="1140" y="678" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922">AWS Lambda</text>
  <text x="1140" y="698" text-anchor="middle" font-size="12" font-weight="600" fill="#d29922">Create Timeline</text>
  <text x="1140" y="718" text-anchor="middle" font-size="10" fill="#8b949e">Translate agent output</text>
  <text x="1140" y="733" text-anchor="middle" font-size="10" fill="#8b949e">→ Mimir API request</text>

  <line x1="1230" y1="700" x2="1288" y2="700" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1259" y="692" text-anchor="middle" font-size="9" fill="#f0883e">step 4</text>

  <!-- Mimir (Timeline Created) -->
  <rect x="1290" y="640" width="170" height="120" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2.5"/>
  <text x="1375" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e">Mimir</text>
  <text x="1375" y="690" text-anchor="middle" font-size="11" fill="#e6edf3">Timeline Created</text>
  <text x="1375" y="710" text-anchor="middle" font-size="10" fill="#8b949e">Rough cut appears</text>
  <text x="1375" y="725" text-anchor="middle" font-size="10" fill="#8b949e">with IN/OUT points</text>
  <text x="1375" y="745" text-anchor="middle" font-size="10" fill="#3fb950">using contentId refs</text>

  <!-- Step numbers Flow 2 -->
  <circle cx="240" cy="530" r="10" fill="#3fb950" opacity="0.9"/>
  <text x="240" y="534" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">1</text>
  <circle cx="460" cy="530" r="10" fill="#3fb950" opacity="0.9"/>
  <text x="460" y="534" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">2</text>
  <circle cx="710" cy="680" r="10" fill="#3fb950" opacity="0.9"/>
  <text x="710" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">3</text>
  <circle cx="1010" cy="700" r="10" fill="#3fb950" opacity="0.9"/>
  <text x="1010" y="704" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">4</text>
  <circle cx="1260" cy="700" r="10" fill="#3fb950" opacity="0.9"/>
  <text x="1260" y="704" text-anchor="middle" font-size="9" font-weight="700" fill="#0d1117">5</text>

  <!-- Data annotations -->
  <rect x="50" y="810" width="300" height="75" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="65" y="830" font-size="11" font-weight="600" fill="#f0883e">Mimir Custom Action Payload</text>
  <text x="65" y="848" font-size="10" fill="#8b949e" font-family="monospace">items[], userToken, actionData,</text>
  <text x="65" y="864" font-size="10" fill="#8b949e" font-family="monospace">userId, script, contentIds[]</text>

  <rect x="420" y="810" width="340" height="75" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="435" y="830" font-size="11" font-weight="600" fill="#bc8cff">AgentCore Output</text>
  <text x="435" y="848" font-size="10" fill="#8b949e" font-family="monospace">timeline: [{contentId, inPoint, outPoint,</text>
  <text x="435" y="864" font-size="10" fill="#8b949e" font-family="monospace">  track, order, matchedScriptSegment}]</text>

  <rect x="830" y="810" width="340" height="75" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1" stroke-opacity="0.5"/>
  <text x="845" y="830" font-size="11" font-weight="600" fill="#3fb950">Mimir Timeline API Request</text>
  <text x="845" y="848" font-size="10" fill="#8b949e" font-family="monospace">POST /timelines → clips with contentId,</text>
  <text x="845" y="864" font-size="10" fill="#8b949e" font-family="monospace">source IN/OUT, track assignments</text>

  <!-- AWS Cloud boundaries -->
  <rect x="260" y="115" width="920" height="260" rx="10" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="1165" y="132" font-size="10" fill="#30363d">AWS Cloud</text>

  <rect x="260" y="455" width="980" height="330" rx="10" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="1225" y="472" font-size="10" fill="#30363d">AWS Cloud</text>

  <!-- Legend -->
  <rect x="1200" y="810" width="280" height="75" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="1215" y="830" font-size="11" font-weight="600" fill="#e6edf3">Legend</text>
  <rect x="1215" y="838" width="10" height="10" rx="2" fill="#f0883e"/>
  <text x="1230" y="848" font-size="9" fill="#8b949e">Mimir</text>
  <rect x="1280" y="838" width="10" height="10" rx="2" fill="#58a6ff"/>
  <text x="1295" y="848" font-size="9" fill="#8b949e">API GW</text>
  <rect x="1345" y="838" width="10" height="10" rx="2" fill="#d29922"/>
  <text x="1360" y="848" font-size="9" fill="#8b949e">Lambda</text>
  <rect x="1215" y="855" width="10" height="10" rx="2" fill="#f85149"/>
  <text x="1230" y="865" font-size="9" fill="#8b949e">Step Fn</text>
  <rect x="1280" y="855" width="10" height="10" rx="2" fill="#bc8cff"/>
  <text x="1295" y="865" font-size="9" fill="#8b949e">Bedrock/AgentCore</text>
  <rect x="1410" y="855" width="10" height="10" rx="2" fill="#3fb950"/>
  <text x="1425" y="865" font-size="9" fill="#8b949e">S3/Vectors</text>
</svg>
